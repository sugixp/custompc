# Local development database. Production uses a managed Postgres (Neon or
# similar); only DATABASE_URL changes.
services:
  db:
    image: postgres:18.6-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: custompc
      POSTGRES_PASSWORD: custompc
      POSTGRES_DB: custompc
    ports:
      # 5433 on the host so it never clashes with a natively installed Postgres.
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U custompc -d custompc"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      # Postgres 18 images keep data under /var/lib/postgresql/<major>/.
      - custompc-db:/var/lib/postgresql

volumes:
  custompc-db:
